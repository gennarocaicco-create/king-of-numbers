    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ----- TA CONFIG ICI -----
  // apiKey, authDomain, projectId, appId : Console > ⚙️ Paramètres du projet > section "Tes applications".

  const firebaseConfig = {
    apiKey: "AIzaSyBT-2trnl2go6J4BfO48oOUj9TZ57J4LIg",
    authDomain: "king-of-bumbers.firebaseapp.com",
    databaseURL: "https://king-of-bumbers-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "king-of-bumbers",
    storageBucket: "king-of-bumbers.firebasestorage.app",
    messagingSenderId: "854287234293",
    appId: "1:854287234293:web:0c1bc7ef2fed4159e241bc",
  };

  if (firebaseConfig.databaseURL !== "TODO") {
    const db = getDatabase(initializeApp(firebaseConfig));
    window.KingDB = {
      ready: true,
      async saveProfile({ id, pseudo, elo, games, best, pwd }) {
        await set(ref(db, "kings/" + id),
          { pseudo, elo, games, best, pwd: pwd || null, updatedAt: Date.now() });
      },
      subscribeLeaderboard(cb) {
        const q = query(ref(db, "kings"), orderByChild("elo"), limitToLast(50));
        return onValue(q, (snap) => {
          const arr = [];
          snap.forEach((c) => arr.push({ id: c.key, ...c.val() }));
          arr.reverse(); // du plus haut ELO au plus bas
          cb(arr);
        });
      },
      async deleteProfile(id) {
        await remove(ref(db, "kings/" + id));
      },
    };
    window.dispatchEvent(new Event("kingdb-ready"));
  }
  // Règles Realtime Database (onglet "Règles") :

    }, 250);
  }
  return () => { if (poll) clearInterval(poll); unsub(); };
}

const ADMIN_CODE = "Berlin";

/* ---------- utils ---------- */
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "").trim();
const nameMatches = (input, player) => {
  const i = norm(input); if (!i) return false;
  const full = norm(player); const parts = full.split(" "); const last = parts[parts.length - 1];
  if (i === full || i === last) return true;
  if (i.length >= 4 && parts.includes(i)) return true;
  return false;
};
const timeScore = (sec) => (sec <= 5 ? 10 : sec <= 15 ? 7 : 5);
const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);
const uid = () => "u_" + Math.random().toString(36).slice(2, 10);
async function hashPwd(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("kdn:" + s));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return "f" + h.toString(16);
  }
}

const C = { bg: "#0a0e14", panel: "#121822", line: "#1f2937", lime: "#c6ff00", ink: "#e7ecf3", mute: "#7b8794", red: "#ff5d5d", green: "#3ee08a" };

function Confetti() {
  const bits = useMemo(() => Array.from({ length: 60 }, () => ({
    l: Math.random() * 100, d: Math.random() * 0.6, dur: 1.4 + Math.random() * 1.2,
    c: [C.lime, "#5ad1ff", "#ffd166", "#ff7eb6", "#fff"][Math.floor(Math.random() * 5)], s: 6 + Math.random() * 8,
  })), []);
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 50 }}>
      {bits.map((b, i) => (
        <div key={i} style={{ position: "absolute", top: -20, left: b.l + "%", width: b.s, height: b.s * 0.5,
          background: b.c, borderRadius: 2, animation: `fall ${b.dur}s ${b.d}s ease-in forwards` }} />
      ))}
    </div>
  );
}

function Onboard({ save, go }) {
  const [v, setV] = useState("");
  const [pw, setPw] = useState("");
  const [list, setList] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => subscribeKings(setList), []);

  const submit = async () => {
    const name = v.trim();
    if (!name || !pw || busy) return;
    setBusy(true);
    const h = await hashPwd(pw);
    const existing = list.find((p) => norm(p.pseudo || "") === norm(name));
    if (!existing) {
      // nouveau joueur : inscription
      save({ pseudo: name, pwd: h });
      go("home");
    } else if (!existing.pwd) {
      // ancien compte sans mot de passe : on le revendique
      save({ id: existing.id, pseudo: existing.pseudo, pwd: h,
        elo: existing.elo ?? 1200, games: existing.games || 0, best: existing.best || 0 });
      go("home");
    } else if (existing.pwd === h) {
      // bon mot de passe : connexion / récupération du compte
      save({ id: existing.id, pseudo: existing.pseudo, pwd: h,
        elo: existing.elo ?? 1200, games: existing.games || 0, best: existing.best || 0 });
      go("home");
    } else {
      setErr("Ce nom est déjà pris. Si c'est le tien, entre le bon mot de passe.");
    }
    setBusy(false);
  };

  const inputStyle = (bad) => ({ width: "100%", background: "#0c1119", border: `1px solid ${bad ? C.red : C.line}`,
    color: C.ink, borderRadius: 14, padding: 16, fontSize: 17, outline: "none", fontFamily: "Sora", textAlign: "center" });

  return (
    <div style={{ marginTop: 50, textAlign: "center" }}>
      <h1 style={{ fontFamily: "Anton, sans-serif", fontSize: 48, lineHeight: .9, textTransform: "uppercase" }}>
        Roi des <span style={{ color: C.lime }}>Numéros</span></h1>
      <p style={{ color: C.mute, margin: "16px 0 6px" }}>Inscris-toi avec un pseudo et un mot de passe.</p>
      <p style={{ color: C.mute, fontSize: 12, margin: "0 0 22px" }}>🔑 Le mot de passe protège ton pseudo et te permet de te reconnecter sur un autre appareil.</p>
      <input value={v} maxLength={20} onChange={(e) => { setV(e.target.value); setErr(""); }} placeholder="Ton pseudo…"
        style={{ ...inputStyle(err), marginBottom: 10 }} />
      <input type="password" value={pw} onChange={(e) => { setPw(e.target.value); setErr(""); }} placeholder="Mot de passe…"
        onKeyDown={(e) => e.key === "Enter" && submit()} style={inputStyle(err)} />
      {err && <p style={{ color: C.red, fontSize: 13, marginTop: 8 }}>{err}</p>}
      <button disabled={!v.trim() || !pw || busy} onClick={submit}
        style={{ ...btnPrimary, background: (v.trim() && pw && !busy) ? C.lime : "#1c2531", color: (v.trim() && pw && !busy) ? "#0a0e14" : C.mute }}>
        {busy ? "…" : "M'inscrire / Me connecter"}
      </button>
    </div>
  );
}

function Game({ mode, go, profile, save }) {
  const deck = useRef(shuffle(mode === "legend" ? DB.filter((d) => d.rarity === "legend") : DB));
  const [idx, setIdx] = useState(0);
  const [val, setVal] = useState("");
  const [phase, setPhase] = useState("ask");
  const [last, setLast] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [elo, setElo] = useState(profile.elo);
  const [confetti, setConfetti] = useState(false);
  const [now, setNow] = useState(Date.now());
  const startRef = useRef(Date.now());
  const inputRef = useRef(null);
  const q = deck.current[idx % deck.current.length];
  const r = RARITY[q.rarity];
  const elapsed = (now - startRef.current) / 1000;
  useEffect(() => { startRef.current = Date.now(); setNow(Date.now()); setTimeout(() => inputRef.current && inputRef.current.focus(), 50); }, [idx]);
  useEffect(() => {
    if (phase !== "ask") return;
    const t = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(t);
  }, [phase, idx]);
  const submit = () => {
    if (phase !== "ask" || val === "") return;
    const sec = (Date.now() - startRef.current) / 1000;
    let correct = false, pts = 0, exact = false;
    if (mode !== "reverse") { correct = nameMatches(val, q.player); if (correct) pts = timeScore(sec) + r.bonus; }
    else { const g = parseInt(val, 10);
      if (g === q.number) { correct = true; exact = true; pts = 10 + r.bonus; }
      else if (Math.abs(g - q.number) === 1) { correct = true; pts = 3; } }
    if (exact) { setConfetti(true); setTimeout(() => setConfetti(false), 2200); }
    setScore((s) => s + pts); setStreak((k) => (correct ? k + 1 : 0));
    setElo((e) => { const exp = 1 / (1 + 10 ** ((r.rating - e) / 400)); return Math.round(e + 24 * ((correct ? 1 : 0) - exp)); });
    setLast({ correct, pts, sec: sec.toFixed(1), exact }); setPhase("result");
  };
  const next = () => {
    if (idx >= 9) { save({ elo, games: profile.games + 1, best: Math.max(profile.best, score) }); go("board"); return; }
    setVal(""); setLast(null); setPhase("ask"); setIdx((i) => i + 1);
  };
  return (
    <div>
      {confetti && <Confetti />}
      <TopBar go={go} title={mode === "reverse" ? "Mode Inversé" : mode === "legend" ? "🐐 Mode Légendaire" : "Qui portait ce numéro ?"} right={`Q ${idx + 1}/10`} />
      <div style={{ display: "flex", justifyContent: "space-between", margin: "14px 2px 18px", fontSize: 13 }}>
        <span style={{ color: C.mute }}>Score <strong style={{ color: C.ink }}>{score}</strong></span>
        <span style={{ color: streak > 1 ? C.lime : C.mute }}>{streak > 1 ? `⚡ ${streak} d'affilée` : "Série 0"}</span>
        <span style={{ color: C.mute }}>ELO <strong style={{ color: C.lime }}>{elo}</strong></span>
      </div>
      {phase === "ask" && (
        <div style={{ textAlign: "center", marginBottom: 12 }}>
          <span style={{ fontFamily: "Anton", fontSize: 32, letterSpacing: 1,
            color: elapsed <= 5 ? C.green : elapsed <= 15 ? C.lime : C.red }}>
            ⏱ {elapsed.toFixed(1)}s
          </span>
        </div>
      )}
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 22, padding: 22, position: "relative", overflow: "hidden", animation: "pop .25s ease both" }}>
        <span style={{ position: "absolute", top: 14, right: 16, fontSize: 11, fontWeight: 700, color: r.color, border: `1px solid ${r.color}55`, borderRadius: 999, padding: "3px 10px" }}>{r.label} +{r.bonus}</span>
        {mode !== "reverse" ? (
          <>
            <div style={{ color: C.mute, fontSize: 13, marginTop: 6 }}>{q.club}</div>
            <div style={{ color: C.mute, fontSize: 13 }}>Saison {q.season}</div>
            <div style={{ fontFamily: "Anton", fontSize: 96, lineHeight: 1, color: C.lime, margin: "6px 0 2px" }}>{q.number}</div>
            <div style={{ color: C.mute, fontSize: 13 }}>Quel joueur portait ce numéro ?</div>
          </>
        ) : (
          <>
            <div style={{ fontFamily: "Anton", fontSize: 34, lineHeight: 1.05, margin: "8px 0 4px", textTransform: "uppercase" }}>{q.player}</div>
            <div style={{ color: C.mute, fontSize: 14 }}>{q.club} · {q.season}</div>
            <div style={{ color: C.mute, fontSize: 13, marginTop: 12 }}>Quel numéro portait-il ?</div>
          </>
        )}
      </div>
      {phase === "ask" ? (
        <div style={{ marginTop: 16 }}>
          <input ref={inputRef} value={val} onChange={(e) => setVal(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
            inputMode={mode === "reverse" ? "numeric" : "text"} placeholder={mode === "reverse" ? "Numéro…" : "Nom du joueur…"}
            style={{ width: "100%", background: "#0c1119", border: `1px solid ${C.line}`, color: C.ink, borderRadius: 14, padding: 16, fontSize: 17, outline: "none", fontFamily: "Sora" }} />
          <button onClick={submit} disabled={val === ""} style={{ ...btnPrimary, background: val === "" ? "#1c2531" : C.lime, color: val === "" ? C.mute : "#0a0e14" }}>Valider</button>
        </div>
      ) : (
        <div style={{ marginTop: 16, animation: "pop .2s ease both" }}>
          <div style={{ background: last.correct ? `${C.green}14` : `${C.red}14`, border: `1px solid ${last.correct ? C.green : C.red}55`, borderRadius: 16, padding: 16 }}>
            <div style={{ fontWeight: 800, color: last.correct ? C.green : C.red, fontSize: 16 }}>
              {last.exact ? "🎯 Parfait !" : last.correct ? "✅ Bonne réponse" : "❌ Raté"}
              {last.pts > 0 && <span style={{ float: "right", fontFamily: "Anton" }}>+{last.pts}</span>}
            </div>
            <div style={{ marginTop: 8, fontSize: 15 }}>{mode !== "reverse" ? <><strong>{q.player}</strong> — {q.number}</> : <><strong>N° {q.number}</strong> · {q.player}</>}</div>
            {mode !== "reverse" && <div style={{ color: C.mute, fontSize: 12, marginTop: 4 }}>en {last.sec}s</div>}
            {q.note && <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}`, color: C.ink, fontSize: 13, lineHeight: 1.5 }}>💡 {q.note}</div>}
          </div>
          <button onClick={next} style={btnPrimary}>{idx >= 9 ? "Terminer 🏆" : "Suivant ›"}</button>
        </div>
      )}
    </div>
  );
}

function Duel({ go }) {
  const deck = useRef(shuffle(DB.filter((d) => d.rarity !== "common").concat(DB)).slice(0, 40));
  const [i, setI] = useState(0); const [turn, setTurn] = useState(0);
  const [sa, setSa] = useState(0); const [sb, setSb] = useState(0);
  const [val, setVal] = useState(""); const [step, setStep] = useState("answer"); const [msg, setMsg] = useState("");
  const startRef = useRef(Date.now());
  const [now, setNow] = useState(Date.now());
  const q = deck.current[i % deck.current.length]; const r = RARITY[q.rarity];
  const names = ["Joueur A", "Joueur B"]; const colors = ["#5ad1ff", "#ff7eb6"];
  const winner = sa >= 100 ? 0 : sb >= 100 ? 1 : null;
  const elapsed = (now - startRef.current) / 1000;
  useEffect(() => { startRef.current = Date.now(); setNow(Date.now()); }, [i, step]);
  useEffect(() => {
    if (step === "reveal") return;
    const t = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(t);
  }, [i, step]);
  const award = (w, p) => (w === 0 ? setSa((s) => s + p) : setSb((s) => s + p));
  const tryAnswer = () => {
    if (val === "") return;
    const sec = (Date.now() - startRef.current) / 1000; const ok = nameMatches(val, q.player);
    if (step === "answer") {
      if (ok) { const p = timeScore(sec) + r.bonus; award(turn, p); setMsg(`✅ ${names[turn]} +${p}`); setStep("reveal"); }
      else { setMsg(`❌ ${names[turn]} se trompe. ${names[1 - turn]} peut voler !`); setVal(""); setStep("steal"); }
    } else { const st = 1 - turn; if (ok) { award(st, 5); setMsg(`🦹 ${names[st]} vole la réponse +5`); } else setMsg("Personne ne marque."); setStep("reveal"); }
  };
  const next = () => { setVal(""); setMsg(""); setStep("answer"); setTurn((t) => 1 - t); setI((x) => x + 1); };
  if (winner !== null) return (
    <div><Confetti /><TopBar go={go} title="Mode Duel" right="" />
      <div style={{ textAlign: "center", marginTop: 60 }}>{ic("👑", 56)}
        <h2 style={{ fontFamily: "Anton", fontSize: 40, margin: "12px 0 4px", color: colors[winner] }}>{names[winner]} gagne !</h2>
        <p style={{ color: C.mute }}>{sa} – {sb}</p>
        <button onClick={() => go("home")} style={btnPrimary}>Retour à l'accueil</button></div>
    </div>
  );
  return (
    <div>
      <TopBar go={go} title="Mode Duel" right="→ 100 pts" />
      <div style={{ display: "flex", gap: 10, margin: "14px 0 18px" }}>
        {names.map((n, k) => (
          <div key={k} style={{ flex: 1, background: turn === k && step === "answer" ? `${colors[k]}1a` : C.panel,
            border: `1px solid ${turn === k && step === "answer" ? colors[k] : C.line}`, borderRadius: 14, padding: 12, textAlign: "center", transition: "all .2s" }}>
            <div style={{ color: colors[k], fontSize: 12, fontWeight: 700 }}>{n}</div>
            <div style={{ fontFamily: "Anton", fontSize: 30 }}>{k === 0 ? sa : sb}</div>
          </div>
        ))}
      </div>
      <div style={{ textAlign: "center", fontSize: 13, marginBottom: 10, animation: step === "steal" ? "pulse 1s infinite" : "none",
        color: step === "steal" ? colors[1 - turn] : C.mute, fontWeight: step === "steal" ? 700 : 400 }}>
        {step === "steal" ? `À ${names[1 - turn]} de voler !` : `Au tour de ${names[turn]}`}
        {step !== "reveal" && <span style={{ fontFamily: "Anton", fontSize: 18, marginLeft: 10,
          color: elapsed <= 5 ? C.green : elapsed <= 15 ? C.lime : C.red }}>⏱ {elapsed.toFixed(1)}s</span>}
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 20, padding: 20, position: "relative" }}>
        <span style={{ position: "absolute", top: 12, right: 14, fontSize: 11, fontWeight: 700, color: r.color, border: `1px solid ${r.color}55`, borderRadius: 999, padding: "2px 9px" }}>{r.label} +{r.bonus}</span>
        <div style={{ color: C.mute, fontSize: 13 }}>{q.club} · {q.season}</div>
        <div style={{ fontFamily: "Anton", fontSize: 80, lineHeight: 1, color: C.lime, margin: "4px 0" }}>{q.number}</div>
        <div style={{ color: C.mute, fontSize: 13 }}>Qui portait ce numéro ?</div>
      </div>
      {step !== "reveal" ? (
        <div style={{ marginTop: 14 }}>
          {msg && <div style={{ color: C.mute, fontSize: 13, marginBottom: 8 }}>{msg}</div>}
          <input value={val} onChange={(e) => setVal(e.target.value)} onKeyDown={(e) => e.key === "Enter" && tryAnswer()} placeholder="Nom du joueur…"
            style={{ width: "100%", background: "#0c1119", border: `1px solid ${C.line}`, color: C.ink, borderRadius: 14, padding: 16, fontSize: 17, outline: "none", fontFamily: "Sora" }} />
          <button onClick={tryAnswer} style={btnPrimary}>{step === "steal" ? "Voler la réponse" : "Valider"}</button>
        </div>
      ) : (
        <div style={{ marginTop: 14, animation: "pop .2s ease both" }}>
          <div style={{ background: "#0c1119", border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}>
            <div style={{ fontWeight: 700 }}>{msg}</div>
            <div style={{ marginTop: 6, color: C.mute, fontSize: 14 }}>Réponse : <strong style={{ color: C.ink }}>{q.player}</strong></div>
          </div>
          <button onClick={next} style={btnPrimary}>Question suivante</button>
        </div>
      )}
    </div>
  );
}

function Leaderboard({ go, profile }) {
  const [list, setList] = useState([]);
  const [live, setLive] = useState(getDB().ready);
  const [reload, setReload] = useState(0);
  const [spin, setSpin] = useState(false);
  useEffect(() => subscribeKings(setList, setLive), [reload]);
  const refresh = () => { setSpin(true); setReload((n) => n + 1); setTimeout(() => setSpin(false), 600); };
  const medals = ["#ffd166", "#c0c8d4", "#cd7f4d"];
  return (
    <div>
      <TopBar go={go} title="Classement" right={live ? "● en direct" : "local"} />
      <div style={{ textAlign: "center", margin: "18px 0" }}>{ic("👑", 40)}
        <div style={{ color: C.mute, fontSize: 13, marginTop: 4 }}>Le vrai roi des numéros</div></div>
      <button onClick={refresh} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
        width: "100%", background: C.panel, border: `1px solid ${C.line}`, color: C.ink, borderRadius: 12,
        padding: "10px 14px", marginBottom: 14, cursor: "pointer", fontFamily: "Sora", fontWeight: 700, fontSize: 14 }}>
        <span style={{ display: "inline-block", animation: spin ? "spin .6s linear" : "none" }}>🔄</span>
        {spin ? "Actualisation…" : "Actualiser le classement"}
      </button>
      {list.length === 0 ? (
        <p style={{ color: C.mute, textAlign: "center", marginTop: 30 }}>Aucune partie enregistrée. Joue une manche !</p>
      ) : (
        <div style={{ display: "grid", gap: 8 }}>
          {list.map((p, i) => {
            const me = p.id === profile.id;
            return (
              <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, background: me ? `${C.lime}12` : C.panel,
                border: `1px solid ${me ? C.lime + "55" : C.line}`, borderRadius: 14, padding: "12px 14px" }}>
                <div style={{ fontFamily: "Anton", fontSize: 20, width: 28, textAlign: "center", color: medals[i] || C.mute }}>{i + 1}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700 }}>{p.pseudo}{me && " (toi)"}</div>
                  <div style={{ color: C.mute, fontSize: 12 }}>{titleFor(p.elo)} · {p.games || 0} parties</div>
                </div>
                <div style={{ fontFamily: "Anton", fontSize: 22, color: C.lime }}>{p.elo}</div>
              </div>
            );
          })}
        </div>
      )}
      {!live && <p style={{ color: C.mute, fontSize: 12, textAlign: "center", marginTop: 20, lineHeight: 1.6 }}>
        Classement local. Renseigne ta config Firebase en haut du fichier pour le partage entre joueurs.</p>}
      <button onClick={() => go("home")} style={btnPrimary}>Rejouer</button>
      <button onClick={() => go("admin")} style={{ width: "100%", marginTop: 10, background: "none", border: "none",
        color: C.mute, fontSize: 12, cursor: "pointer", fontFamily: "Sora", textDecoration: "underline" }}>
        🔒 Admin
      </button>
    </div>
  );
}

function Admin({ go }) {
  const [code, setCode] = useState("");
  const [ok, setOk] = useState(false);
  const [err, setErr] = useState("");
  const [list, setList] = useState([]);
  useEffect(() => { if (!ok) return; return subscribeKings(setList); }, [ok]);

  const tryLogin = () => {
    if (code === ADMIN_CODE) { setOk(true); setErr(""); }
    else setErr("Code incorrect.");
  };
  const del = (p) => {
    if (window.confirm(`Supprimer "${p.pseudo}" du classement ? Cette action est définitive.`)) {
      getDB().deleteProfile(p.id);
    }
  };

  if (!ok) return (
    <div>
      <TopBar go={go} title="Admin" right="" />
      <div style={{ marginTop: 40, textAlign: "center" }}>
        {ic("🔒", 40)}
        <p style={{ color: C.mute, margin: "12px 0 18px" }}>Entre le code admin.</p>
        <input type="password" value={code} onChange={(e) => { setCode(e.target.value); setErr(""); }}
          onKeyDown={(e) => e.key === "Enter" && tryLogin()} placeholder="Code…"
          style={{ width: "100%", background: "#0c1119", border: `1px solid ${err ? C.red : C.line}`, color: C.ink, borderRadius: 14, padding: 16, fontSize: 17, outline: "none", fontFamily: "Sora", textAlign: "center" }} />
        {err && <p style={{ color: C.red, fontSize: 13, marginTop: 8 }}>{err}</p>}
        <button onClick={tryLogin} style={btnPrimary}>Entrer</button>
      </div>
    </div>
  );

  return (
    <div>
      <TopBar go={go} title="Admin · participants" right={`${list.length}`} />
      <p style={{ color: C.mute, fontSize: 13, margin: "14px 0" }}>Appuie sur 🗑️ pour retirer un participant du classement.</p>
      {list.length === 0 ? (
        <p style={{ color: C.mute, textAlign: "center", marginTop: 20 }}>Aucun participant.</p>
      ) : (
        <div style={{ display: "grid", gap: 8 }}>
          {list.map((p) => (
            <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, background: C.panel,
              border: `1px solid ${C.line}`, borderRadius: 14, padding: "12px 14px" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700 }}>{p.pseudo}</div>
                <div style={{ color: C.mute, fontSize: 12 }}>ELO {p.elo} · {p.games || 0} parties</div>
              </div>
              <button onClick={() => del(p)} style={{ background: `${C.red}1a`, border: `1px solid ${C.red}55`,
                color: C.red, borderRadius: 10, padding: "8px 12px", cursor: "pointer", fontFamily: "Sora", fontWeight: 700 }}>
                🗑️
              </button>
            </div>
          ))}
        </div>
      )}
      <button onClick={() => go("board")} style={btnPrimary}>Retour au classement</button>
    </div>
  );
}

function TopBar({ go, title, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <button onClick={() => go("home")} style={{ background: C.panel, border: `1px solid ${C.line}`, color: C.ink, borderRadius: 10, width: 38, height: 38, display: "grid", placeItems: "center", cursor: "pointer" }}>{ic("🏠", 18)}</button>
      <div style={{ fontWeight: 800, fontSize: 15, flex: 1 }}>{title}</div>
      <span style={{ color: C.mute, fontSize: 13 }}>{right}</span>
    </div>
  );
}
const btnPrimary = { width: "100%", background: C.lime, color: "#0a0e14", border: "none", borderRadius: 14, padding: 16, fontWeight: 800, fontSize: 16, cursor: "pointer", fontFamily: "Sora", marginTop: 16 };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
